<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TradeGuard{% endblock %}</title>

    <style>
    
    * {
        box-sizing: border-box;
    }

    canvas {
        width: 100% !important;
        max-width: 100%;
        height: auto !important;
    }

    body {
        margin: 0;
        font-family: Arial;
        background: #0f172a;
        color: white;
    }

    .menu-btn {
        position: fixed;
        top: -5px;
        left: 15px;
        background: #38bdf8;
        border: none;
        padding: 10px 12px;
        border-radius: 8px;
        color: black;
        font-size: 18px;
        cursor: pointer;
        z-index: 1000;
    }

    .form-box {
        max-width: 350px;
        margin: 60px auto;
        display: flex;
        flex-direction: column;
    }

    .form-box label {
        margin-top: 10px;
        margin-bottom: 5px;
        font-size: 14px;
        color: #cbd5f5;
    }

    .form-box input {
        padding: 10px;
        border-radius: 8px;
        border: none;
        margin-bottom: 10px;
        background: #1e293b;
        color: white;
    }

    .form-box input::placeholder {
        color: #94a3b8;
    }

    .form-box button {
        margin-top: 15px;
        padding: 10px;
        border: none;
        border-radius: 8px;
        background: #38bdf8;
        color: black;
        font-weight: bold;
        cursor: pointer;
    }

    .form-box button:hover {
        background: #0ea5e9;
    }  

    body {
        margin: 0;
        font-family: Arial;
        background: #0f172a;
        color: white;
        overflow-x: hidden;
    }

    /* CENTER CONTAINER */
    .auth-container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    /* BOX */
    .auth-box {
        background: rgba(255,255,255,0.05);
        backdrop-filter: blur(10px);
        padding: 30px;
        border-radius: 15px;
        width: 320px;
        box-shadow: 0 0 20px rgba(0,0,0,0.3);
        text-align: center;
    }

    /* TITLE */
    .auth-box h2 {
        margin-bottom: 20px;
        color: #38bdf8;
    }

    /* FORM */
    .form-box {
        display: flex;
        flex-direction: column;
    }

    /* LABELS */
    .form-box label {
        text-align: left;
        margin-top: 10px;
        font-size: 14px;
        color: #cbd5f5;
    }

    /* INPUTS */
    .form-box input {
        padding: 10px;
        border-radius: 8px;
        border: none;
        margin-top: 5px;
        background: #1e293b;
        color: white;
    }

    /* PLACEHOLDER */
    .form-box input::placeholder {
        color: #94a3b8;
    }

    /* BUTTON */
    .form-box button {
        margin-top: 20px;
        padding: 10px;
        border: none;
        border-radius: 8px;
        background: #38bdf8;
        color: black;
        font-weight: bold;
        cursor: pointer;
    }

    .form-box button:hover {
        background: #0ea5e9;
    }

    /* LINK */
    .auth-link {
        margin-top: 15px;
        font-size: 14px;
    }

    .auth-link a {
        color: #38bdf8;
        text-decoration: none;
    }

    /* SIDEBAR */
    .sidebar {
        width: 200px;
        background: #020617;
        height: 100vh;
        padding: 20px;
        position: fixed;
        left: -220px;
        top: 0;
        transition: 0.3s;
        z-index: 999;
        border-right: 1px solid rgba(56,189,248,0.2);
    }

    .sidebar.active {
        left: 0;
    }

    .sidebar h2 {
        color: #38bdf8;
    }

    .sidebar a {
        display: block;
        color: white;
        text-decoration: none;
        margin: 15px 0;
    }

    .sidebar a.active {
        color: #38bdf8;
    }

    /* MAIN */
    .main {
        width: 100%;
        min-height: 100vh;
        padding: 20px;
        transition: margin-left 0.3s ease;
    }

    /* DESKTOP */
    @media (min-width: 769px) {

        .main.shift {
         margin-left: 220px;
        }

    }

    /* MOBILE */
    @media (max-width: 768px) {
        
        .main {
            margin-left: 0;
            width: 100%;
            padding: 15px;
        }

        .sidebar {
            left: -220px;
        }

        .sidebar.active {
            left: 0;
        }

        .cards {
            justify-content: center;
        }

        .card {
            width: 90%;
            flex: 1 1 100%;
        }

        table {
            font-size: 12px;
        }

}

    /* CARDS */
    .cards {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
    }

    .card {
        flex: 1 1 45%;
        max-width: 100%;
        background: linear-gradient(145deg,#16213e,#1f2a44);
        padding: 25px;
        border-radius: 18px;
        text-align: center;
        transition: 0.3s;
        border: 1px solid rgba(56,189,248,0.2);
        box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    }

    .card:hover {
        transform: translateY(-8px);
        box-shadow: 0 8px 30px rgba(56,189,248,0.25);
    }

    /* TABLE */

    .table-container {
        width: 100%;
        overflow-x: auto;
    }

    table {
        width: 100%;
        margin-top: 20px;
        border-collapse: collapse;
        display: block;
        overflow-x: auto;
        white-space: nowrap;
    }

    th, td {
        padding: 10px;
        text-align: center;
    }

    th {
        background: #1e293b;
    }

    tr:nth-child(even) {
        background: #111827;
    }

    /* COLORS */
    .green { color: #22c55e; }
    .red { color: #ef4444; }

   


    canvas {
        max-width: 100%;
        height: 250px !important;
    }

    /* LOADER */
    #loader {
        position: fixed;
        width: 100%;
        height: 100%;
        background: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
    }

    .loader-circle {
        width: 50px;
        height: 50px;
        border: 5px solid #1e293b;
        border-top: 5px solid #38bdf8;
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        100% { transform: rotate(360deg); }
    }

    /* LANDING PAGE */
    .landing {
        width: 100%;
        text-align: center;
    }

    /* HERO */
    .hero {
        margin-top: 100px;
    }

    .hero h1 {
        font-size: 40px;
        color: #38bdf8;
    }

    .hero p {
        font-size: 18px;
        color: #cbd5f5;
        margin: 10px 0 20px;
    }

    /* BUTTONS */
    .hero-buttons {
        margin-top: 20px;
    }

    .btn-primary {
        background: #38bdf8;
        padding: 12px 20px;
        border-radius: 8px;
        color: black;
        text-decoration: none;
        margin-right: 10px;
        font-weight: bold;
    }

    .btn-secondary {
        background: transparent;
        border: 1px solid #38bdf8;
        padding: 12px 20px;
        border-radius: 8px;
        color: #38bdf8;
        text-decoration: none;
    }

    /* FEATURES */
    .features {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 60px;
        flex-wrap: wrap;
    }

    .feature {
        background: rgba(255,255,255,0.05);
        padding: 20px;
        border-radius: 12px;
        width: 250px;
    }

    /* LANDING PAGE */

    .landing {
        text-align: center;
        padding: 40px 20px;
    }

    .hero h1 {
        font-size: 36px;
        margin-bottom: 10px;
    }

    .hero p {
        color: #cbd5f5;
        margin-bottom: 20px;
    }

    .hero-buttons {
        margin-top: 20px;
    }

    .btn-primary {
        background: #38bdf8;
        color: black;
        padding: 12px 20px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: bold;
        margin-right: 10px;
    }

    .btn-secondary {
        background: transparent;
        border: 1px solid #38bdf8;
        color: #38bdf8;
        padding: 12px 20px;
        border-radius: 8px;
        text-decoration: none;
    }

    .features {
        margin-top: 50px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
    }

    .feature {
        background: rgba(255,255,255,0.05);
        padding: 20px;
        border-radius: 12px;
        max-width: 250px;
    }

    .why {
        margin-top: 60px;
    }

    .cta {
        margin-top: 60px;
    }

    /* UPGRADE PAGE */

    .upgrade-container {
        text-align: center;
        padding: 40px 20px;
    }

    .sub {
        color: #94a3b8;
        margin-bottom: 30px;
    }

    .pricing-card {
        background: rgba(255,255,255,0.05);
        padding: 30px;
        border-radius: 15px;
        max-width: 350px;
        margin: auto;
        backdrop-filter: blur(10px);
    }

    .pricing-card h2 {
        color: #38bdf8;
    }

    .pricing-card h3 {
        margin: 10px 0;
    }

    .pricing-card ul {
        list-style: none;
        padding: 0;
        margin: 20px 0;
    }

    .pricing-card li {
        margin: 10px 0;
    }

    .btn-upgrade {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 20px;
        background: #38bdf8;
        color: black;
        border-radius: 8px;
        text-decoration: none;
        font-weight: bold;
    }

    .btn-upgrade:hover {
        background: #0ea5e9;
    }

    button,
    .btn-upgrade {
        transition: all 0.3s ease;
    }

    button:hover,
    .btn-upgrade:hover {
        transform: scale(1.03);
}

    .free-note {
        margin-top: 20px;
        font-size: 14px;
        color: #94a3b8;
    }

    .card-btn{
        display:inline-block;
        margin-top:15px;
        padding:10px 18px;
        background:#38bdf8;
        color:black;
        text-decoration:none;
        border-radius:8px;
        font-weight:bold;
    }

    .card-btn:hover{
        background:#0ea5e9;
    }

    .footer{
        width:100%;
        text-align:center;
        padding:20px;
        margin-top:40px;
        border-top:1px solid rgba(255,255,255,0.08);
    }

    .footer a{
        color:#94a3b8;
        margin:0 15px;
        text-decoration:none;
        font-size:14px;
    }

    .footer a:hover{
        color:#38bdf8;
    }

    .action-btn{
        display:inline-block;
        margin-top:15px;
        padding:10px 18px;
        background:#38bdf8;
        color:black !important;
        text-decoration:none;
        border-radius:8px;
        font-weight:bold;
    }

    .action-btn:hover{
        background:#0ea5e9;
    }

    </style>
</head>

<body>

<div id="loader">
    <div class="loader-circle"></div>
</div>

{% if session.get("user_id") %}
<button onclick="toggleMenu()" class="menu-btn">☰</button>
{% endif %} 

<script>
function toggleMenu() {

    const sidebar = document.querySelector(".sidebar");
    const main = document.querySelector(".main");

    if (!sidebar || !main) return;

    sidebar.classList.toggle("active");
    main.classList.toggle("shift");

}
</script>

{% if session.get("user_id") %}
<div class="sidebar">
    <h2>TradeGuard</h2>

    <p style="font-size:12px;color:#94a3b8;margin-top:-10px;">
        Trade Smarter. Risk Better.
    </p>

    <a href="/journal" class="{% if request.path == '/journal' %}active{% endif %}">📒 Journal</a>
    <a href="/monthly" class="{% if request.path == '/monthly' %}active{% endif %}">📊 Monthly</a>
    <a href="/risk" class="{% if request.path == '/risk' %}active{% endif %}">⚖️ Risk Tool</a>
    <a href="/feedback" class="{% if request.path == '/feedback' %}active{% endif %}">💬 Feedback</a>
    <a href="/upgrade" class="{% if request.path == '/upgrade' %}active{% endif %}">💎 Upgrade</a>
    <a href="/logout">🚪 Logout</a>
</div>
{% endif %}

<!-- MAIN CONTENT -->
<div class="main">
    {% block content %}{% endblock %}
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {

    // Hide loader when page fully loads
    window.addEventListener("load", function() {
        document.getElementById("loader").style.display = "none";
    });

    // Fix back button loader bug
    window.addEventListener("pageshow", function() {
        document.getElementById("loader").style.display = "none";
    });

    // Show loader on navigation
    document.querySelectorAll("a").forEach(link => {
        link.addEventListener("click", function() {
            document.getElementById("loader").style.display = "flex";
        });
    });

});
</script>

<footer class="footer">
    <a href="{{ url_for('terms') }}">Terms</a>
    <a href="{{ url_for('privacy') }}">Privacy</a>
    <a href="{{ url_for('refund') }}">Refund Policy</a>
</footer>

</body>

</html>
