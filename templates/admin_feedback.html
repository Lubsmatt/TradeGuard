{% extends "base.html" %}

{% block content %}

<h2>📩 User Feedback</h2>

<table>
<tr>
    <th>User</th>
    <th>Feedback</th>
    <th>Date</th>
</tr>

{% for item in feedbacks %}
<tr>
    <td>{{ item.email }}</td>
    <td>
        <strong>Rating: {{ item.rating }}/5
    </td>
    <td>{{ item.feedback }}</td>
    <td>{{ item.created_at }}</td>
</tr>
{% endfor %}

</table>

{% endblock %}
